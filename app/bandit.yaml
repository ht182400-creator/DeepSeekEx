# Bandit 安全扫描配置（YAML 格式）
# 误报统一在此声明，避免散落在代码行内产生告警噪音

# 排除测试目录（测试数据含占位 token，非真实凭据）
exclude_dirs:
  - tests

# 豁免项及理由：
# B105/B107: api_key/web_token 默认空字符串是配置占位符，非硬编码口令
# B404/B603: 仅调用配置中固定的本地 PoW 求解器（Go/Node），cmd 为 list 形式、无 shell，
#            输入是服务端收到的挑战数据，非用户可控命令
skips:
  - B105
  - B107
  - B404
  - B603
